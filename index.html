<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SHIROTOKURA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHIROTOKURA">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #071526; overflow: hidden;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
  <script>
    // iPhoneホーム画面用の「ネイビー×白文字」専用アイコンを自動生成してセット
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // ディープネイビー背景
      ctx.fillStyle = '#071526';
      ctx.fillRect(0, 0, 512, 512);

      // 内側の細い白枠（名刺・HPテイスト）
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 6;
      ctx.strokeRect(36, 36, 440, 440);

      // 中央に大きく「S」
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 220px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', 256, 215);

      // 下部に「SHIROTOKURA」ロゴ文字
      ctx.font = '700 40px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
      ctx.fillText('SHIROTOKURA', 256, 390);

      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = canvas.toDataURL('image/png');
      document.head.appendChild(link);
    });
  </script>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbyEObZSCGlWnOucv3oLh-S3VLJGmSm2-GwyG0yys6fquGIMYP_brkMapSYg-CuY_-v8wA/exec" allow="clipboard-read; clipboard-write"></iframe>
</body>
</html>
