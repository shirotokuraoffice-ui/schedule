<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SHIROTOKURA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHIROTOKURA">
  <link rel="apple-touch-icon" href="icon.png?v=2">
  <link rel="icon" type="image/png" href="icon.png?v=2">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #071526;
      overflow: hidden;
    }
    #appWrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100dvh;
      background-color: #071526;
      padding-top: env(safe-area-inset-top, 0px);
    }
    @media all and (display-mode: standalone) {
      #appWrap {
        padding-top: max(calc(env(safe-area-inset-top, 59px) + 25px), 84px);
      }
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyEObZSCGlWnOucv3oLh-S3VLJGmSm2-GwyG0yys6fquGIMYP_brkMapSYg-CuY_-v8wA/exec";

    function adjustStandaloneLayout() {
      const wrap = document.getElementById('appWrap');
      if (!wrap) return;

      const probe = document.createElement('div');
      probe.style.paddingTop = 'env(safe-area-inset-top, 0px)';
      document.body.appendChild(probe);
      const safeTop = parseInt(window.getComputedStyle(probe).paddingTop, 10) || 0;
      document.body.removeChild(probe);

      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

      if (isStandalone) {
        wrap.style.paddingTop = Math.max(safeTop + 25, 84) + 'px';
        const isPortrait = window.innerWidth < window.innerHeight;
        const fullHeight = isPortrait ? window.screen.height : window.screen.width;
        document.documentElement.style.height = fullHeight + 'px';
        document.body.style.height = fullHeight + 'px';
        wrap.style.height = fullHeight + 'px';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      adjustStandaloneLayout();
      // 起動するたびに最新バージョンを読み込む（キャッシュ防止）
      document.getElementById('gasFrame').src = GAS_URL + "?t=" + Date.now();
    });
    window.addEventListener('resize', adjustStandaloneLayout);
  </script>
</head>
<body>
  <div id="appWrap">
    <iframe id="gasFrame" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</body>
</html>
